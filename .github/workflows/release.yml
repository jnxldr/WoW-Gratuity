# Packages the add-on and uploads it to CurseForge, Wago (and WoWInterface, if set up) and a GitHub release when a version
# tag such as 2.0.3 is pushed (no "v": the tag becomes ## Version as it is).
# Project IDs come from the .toc (X-Curse-Project-ID, X-Wago-ID, X-WoWI-ID); tokens from the repo secrets.
name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest # standard runner: free for public repos
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }} # built in, no setup
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the packager reads the tags

      - uses: BigWigsMods/packager@v2
